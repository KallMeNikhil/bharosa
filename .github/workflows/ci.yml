name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bharosa_admin
          POSTGRES_PASSWORD: bharosa_admin
          POSTGRES_DB: bharosa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bharosa_admin -d bharosa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://bharosa_app:bharosa_app@localhost:5432/bharosa
      MIGRATION_DATABASE_URL: postgresql+psycopg://bharosa_owner:bharosa_owner@localhost:5432/bharosa
      VERIFICATION_DATABASE_URL: postgresql+psycopg://bharosa_verifier:bharosa_verifier@localhost:5432/bharosa
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Provision database (PostGIS + owner/app roles)
        run: |
          PGPASSWORD=bharosa_admin psql -h localhost -U bharosa_admin -d bharosa \
            -f ../infra/postgres-init.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Migration upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Tests
        run: pytest -q

      - name: Architecture invariant checks
        run: pytest -q -m db_privilege

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
