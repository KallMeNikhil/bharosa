services:
  - type: web
    name: bharosa-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    dockerCommand: sh bin/start.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: VERIFICATION_DATABASE_URL
        sync: false
      - key: SIGNING_MASTER_KEY
        sync: false
      - key: CLIENT_REFERENCE_SALT
        generateValue: true
      - key: DIGITAL_LINK_HOST
        sync: false
