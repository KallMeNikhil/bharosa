# The whole platform, in one command.
#
#   docker compose -f infra/docker-compose.yml up
#
# Services start in dependency order: the database provisions its roles and
# PostGIS extension on first boot, the migration runner applies the schema and
# exits, and only then does the API start. The console waits for the API to
# report the database usable, so a browser never lands on a half-built stack.

name: bharosa

# Inside the compose network the database answers to `db`, not localhost. These
# are development credentials that match infra/postgres-init.sql; the three
# roles are separate on purpose and must not be collapsed into one.
x-backend-env: &backend-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://bharosa_app:bharosa_app@db:5432/bharosa
  MIGRATION_DATABASE_URL: postgresql+psycopg://bharosa_owner:bharosa_owner@db:5432/bharosa
  VERIFICATION_DATABASE_URL: postgresql+psycopg://bharosa_verifier:bharosa_verifier@db:5432/bharosa
  DIGITAL_LINK_HOST: id.bharosa.example
  VERIFICATION_RATE_LIMIT_PER_MINUTE: "30"
  VERIFICATION_RATE_LIMIT_BURST: "10"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bharosa_admin
      POSTGRES_PASSWORD: bharosa_admin
      POSTGRES_DB: bharosa
    ports:
      - "5432:5432"
    volumes:
      - bharosa_pg_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory: creates PostGIS and the owner,
      # app and verifier roles the migrations grant against.
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharosa_admin -d bharosa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs to completion and stops. Row-level security policies and table grants
  # exist only in the migrations, so the schema is unusable until this succeeds
  # and nothing downstream should start before it does.
  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    volumes:
      # Source is mounted so edits reload without a rebuild. The editable
      # install in the image already points here.
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /ready, not /health: this gate exists to prove the database is
      # reachable, and /health deliberately does not touch it.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ../frontend
    environment:
      # Vite proxies /api here, so the browser makes same-origin requests and
      # the backend needs no CORS middleware.
      BHAROSA_API_ORIGIN: http://api:8000
    volumes:
      - ../frontend:/app
      # Keeps the container's Linux node_modules from being shadowed by the
      # host's, which are built for a different platform.
      - bharosa_web_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bharosa_pg_data:
  bharosa_web_modules:
